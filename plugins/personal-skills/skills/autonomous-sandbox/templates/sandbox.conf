# $SB/ctl/sandbox.conf. Sourced by the host scripts and by the driver. It lives in $SB/ctl, which is read-only inside
# the container, so the agent cannot change what the host sources. Plain KEY=value, no spaces around '='.
SB=/home/CHANGE_ME/sandboxes/REPO            # host path of the sandbox root
REPO=REPO                                    # directory name under $SB/work
BRANCH=autonomous                            # the only branch the run works on; the handoff bundle carries it
RUN_HOURS=24                                 # total run length; the first job writes ctl/DEADLINE
# MAX_JOBS=                                  # cap on chained jobs plus restarts (default RUN_HOURS/23 + 3)
MODEL=claude-opus-5-5
MAX_TURNS=400

# --- Success criterion (frozen before launch; ctl/ is read-only to the agent, $SB/eval is never mounted for it) ---
CRITERION=metric                             # metric: SUCCESS_CMD prints "METRIC <number>" (level 1)
                                             # rubric: a fresh same-model judge scores ctl/RUBRIC.md (level 4)
SUCCESS_CMD=""                               # runs on a copy of the repo, offline, CHECK_SEED set. With SCORE_CMD it sees
                                             # only $SB/eval/inputs at /eval/inputs and writes predictions to /pred;
                                             # without it, it sees all of $SB/eval and prints METRIC itself (weaker: the
                                             # agent's code runs next to the labels)
SCORE_CMD=""                                 # optional, recommended: owner's frozen scorer, cwd /eval, sees /eval and /pred
                                             # (read-only) and no agent code; prints "METRIC <number>"
METRIC_GOAL=lower                            # lower|higher (rubric: always higher, total of criterion scores)
THRESHOLD=                                   # metric: success when METRIC <= (lower) or >= (higher) this. rubric: unused,
                                             # success = every criterion passes
MIN_DELTA=0                                  # an improvement must beat the best accepted metric by more than this
REGRESS_TOLERANCE=0                          # a round is reverted if its metric is worse than the best by more than this
SUCCESS_STREAK=3                             # the criterion must hold on this many consecutive checks (seeds 1..n)
STALL_ROUNDS=5                               # this many rounds in a row without improvement -> STALLED
CHECK_SECONDS=3600                           # cap per check command (tests, stage 1, stage 2)

# --- GPUs and training (owner decision 2026-11-06: the host trains, in the checker, never the maker) ---
USE_GPU=0                                    # 1: pass the job's GPUs (--nv) to the maker, tests, training and stage 1.
                                             # Also add --gres=gpu:N to SBATCH_OPTS and use an image with CUDA user libs
TRAIN_CMD=""                                 # frozen full training, run by the host on the copy, cwd = the repo copy.
                                             # Sees /data (ro), CHECK_SEED, and writes checkpoints to /artifacts, which
                                             # stage 1 reads (ro). The maker changes the code and config it runs
TRAIN_SECONDS=14400                          # hard cap on one training run. Size it to the longest run you accept
STREAK_RETRAIN=1                             # 1: each streak check retrains with a new CHECK_SEED (honest for noisy
                                             # training; costs SUCCESS_STREAK x TRAIN_SECONDS). 0: re-evaluate only
TRAIN_OFFLINE=0                              # 1: training gets no proxy (stage all downloads into $SB/data first)
JUDGE_MODEL=$MODEL                           # owner decision 2026-11-06: same model, separate context (state it in the report)
JUDGE_MAX_TURNS=60
JUDGE_SECONDS=1800

# --- Rounds (one round = one change = one maker session, then the host's check) ---
ROUND_MAX_SECONDS=5400                       # cap per maker session (90 min: one change, not a backlog)
MIN_ROUND_SECONDS=2400                       # shortest maker session worth starting (R7)
# CHECK_RESERVE_SECONDS=                     # time kept for one check after the maker; default: the sum of the caps
                                             # (tests + training + stage 1 + stage 2, or tests + judge) + 300 s + 600 s.
                                             # A round starts only if maker + reserve fit before this job ends;
                                             # otherwise the job yields to the chained one
STALL_SECONDS=2700                           # watchdog: kill a session whose log has not grown for this long
BACKOFF_SECONDS=1800                         # wait after a real usage/rate limit
MAX_CONSECUTIVE_FAILURES=8
DISK_LIMIT_GB=50                             # host watchdog: work+home+logs+state+scratch+pred+artifacts above this kills the container and writes STOP
DISK_CHECK_SECONDS=60                         # measured: dd on this NFS writes ~100 MB/s, so overshoot is up to ~6 GB per interval
NPROC_LIMIT=4096                             # ulimit -u inside the container (counts all your processes on the node)
# Slurm options for every job in the chain (24h partitions: keep --time under the limit)
SBATCH_OPTS="-J REPO-auto -p main --cpus-per-task=8 --mem=32G --time=23:55:00 --signal=B:USR1@900"
# GPU run, e.g.: SBATCH_OPTS="-J REPO-auto -p main --gres=gpu:rtx6000ada:1 --cpus-per-task=16 --mem=64G --time=23:55:00 --signal=B:USR1@900"
# The job must fit MIN_ROUND_SECONDS + one check + 900 s; preflight checks it. A training run longer than
# about 20 h doesn't fit a 24 h job: it would need checkpoint resume across jobs, which this skill doesn't do
# The project's tests: run by the host on a copy after every round (a failing round is reverted) and by finaltest
TEST_CMD="npm test && (cd mobile && npm test -- --silent)"
EXTRA_CHECK_CMD=""                           # e.g. "for r in \$(ls docs/rounds); do python3 tools/round_log_check.py \$r; done"
# Pin by digest once pulled (apptainer inspect, or docker manifest digest): docker://node:22-bookworm@sha256:...
APPTAINER_IMAGE=docker://node:22-bookworm    # has git, python3, curl. The image needs node (the claude CLI), git
                                             # and python. --nv brings the driver; CUDA user libs come from the image
                                             # or from pip wheels (PyTorch wheels bundle them)
