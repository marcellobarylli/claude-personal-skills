<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>REPLACE — artifact title</title>

<!--
===============================================================================
  PROVENANCE — replace this block, don't delete it.

  Derived artifact. Source of record: <the corpus, with versions/commit>.
  Built <date>. This file asserts nothing the sources do not; where it differs
  it is a PRESENTATION difference, never a claim difference.

  SYNC RULE. Content lives in the DATA block below, separate from presentation,
  so a re-sync is a data edit. This is not generated from the sources: the
  artifact is a reorganisation, so a transform would fight the design.

  SOURCE PRECEDENCE. <List the places a later document narrows an earlier one.
  These are the regression tests — a faithful transcription of the broad
  version silently reinstates a retracted claim.>

  BUILT AGAINST SIX CRITERIA (see the skill's references/evidence.md; the
  popular ones that FAILED meta-analysis are listed there too, so you don't
  rebuild them):
    1 No reading unit requires scrolling or panning. PASS/FAIL, measured with
      scripts/fit-check.sh — never eyeballed.
    2 Cut extraneous material.
    3 Signal structure.
    4 Diagrams ALONGSIDE prose, never instead of it.
    5 A compact table can beat matched prose.
    6 Remove time pressure; never frame it as preliminary. NO reading-time
      estimate, NO completion bar, NO "quick summary" framing. Largest lever.

  PROSE follows the skill's references/style.md (McCarthy's rules, via Savage &
  Yeh, Nature 2019). Run scripts/prose-audit.py before publishing. In short:
  few dashes and never two sentences running, no bold or italics for emphasis
  inside sentences, one idea per sentence, no "X, not Y" reflex.

  The position indicator shows position in an ARGUMENT (structural signalling,
  criterion 3 — supported). It is NOT a completion or time-remaining cue, which
  criterion 6 excludes. Keep that distinction if you edit it.

  FIGURES. Every spine node and every cluster subsection carries one figure,
  and a second only when it shows a different relation (criterion 4:
  Text+Diagrams g = 0.45). They sit BELOW the text, in the [data-fit-exempt]
  region: the text must still fit one screen, and the reader scrolls only to
  reach the figures. Each figure carries the brief it was chosen against
  (brief:{rel,kind,form}, written before retrieval; see references/visuals.md).
  A merely topical image is a seductive detail (g = -0.33 to -0.41), so a
  panel where nothing meets the brief gets nofig:'<reason>', not decoration.
  Images live in figures/ and are embedded by `scripts/figures.py inline`,
  which fills the FIGS block. Never paste base64 by hand.
  <List each figure's licence here, and flag any that is not openly licensed
  before the artifact is shared.>

  CITATIONS. Prose cites inline with {{card-id}} or {{card-id|locator}}; each
  screen's evidence list is derived from those markers. Run
  scripts/cite-audit.py (gate 11) after every edit, with --against the last
  published copy so a dropped marker shows up. <Record its numbers here.>

  DO NOT ADD:
    - Tap-to-reveal for anything load-bearing. Layering measured FASTER BUT
      LESS ACCURATE (N=749) and was rated easier while being worse. Caveats
      render WITH their claim; with every expander shut this must read as a
      complete text.
    - Prompts or questions. Pretesting is null for text; self-explanation's
      comprehension cell does not clear zero; and no study has tested a prompt
      that collects no answer, which is exactly the optional form.
    - A "verified" marker. Certifying every claim needs evidence the corpus
      does not contain; a false certification is worse than none.
    - A service worker (unless you want a hosted copy to work offline — say
      plainly that without one, only the local file is offline).
===============================================================================
-->

<style>
:root{
  --bg:#fdfcfa; --surface:#fff; --text:#191817; --muted:#5c5956; --faint:#8a8681;
  --rule:#e4e1db; --rule-strong:#cdc8c0; --focus:#1f4e73;
  --k1:#3f5680; --k2:#2f6b52; --k3:#8a5330; --k4:#7a3350;   /* cluster hues */
  --warn:#8a5e14; --ours:#5f5b74;                            /* the 2 annotations */
  --sp:clamp(13px,3.6vw,15px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15171a; --surface:#1d2024; --text:#e9e7e3; --muted:#a8a39c; --faint:#817c75;
    --rule:#2c3035; --rule-strong:#3d434a; --focus:#7fb5e0;
    --k1:#8fa8d4; --k2:#79c3a2; --k3:#d99d72; --k4:#d890ad;
    --warn:#d9a74e; --ours:#a9a3c4;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;
  font:400 var(--sp)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
h1,h2{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.01em}
p{margin:0}
a{color:var(--focus);text-decoration:none;border-bottom:1px solid currentColor}

/* ---- header + the always-visible anchor vocabulary ---- */
header{flex:0 0 auto;background:var(--surface);position:relative;z-index:30;
  border-bottom:1px solid var(--rule);padding:env(safe-area-inset-top) 0 0}
.brand{padding:.5em .9em .4em;font-size:.78em;color:var(--muted)}
.brand b{color:var(--text);font-size:1.15em}
/* Every level stays readable at all times. Tapping ADDS detail; it never
   reveals that the levels exist. An unlabelled expander is the pattern that
   measured worse — the closed state must carry the proposition. */
#anchorBtn{display:flex;width:100%;gap:0;border:0;border-top:1px solid var(--rule);
  background:transparent;padding:0;cursor:pointer;font:inherit;text-align:left;
  min-height:44px;align-items:stretch;
  /* explicit: inheriting the UA's `buttontext` makes these vanish wherever the
     palette and the browser's colour scheme desynchronise. */
  color:var(--text)}
#anchorBtn .lv{flex:1;padding:.42em .5em;border-right:1px solid var(--rule);
  display:flex;flex-direction:column;justify-content:center}
#anchorBtn .lv:last-of-type{border-right:0}
#anchorBtn .k{font-weight:700;font-size:.82em}
#anchorBtn .g{font-size:.72em;color:var(--muted);line-height:1.2}
#anchorBtn .caret{flex:0 0 28px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:.7em;border-left:1px solid var(--rule)}
/* OVERLAY, not push: pushing layout shrank every content screen by 160-430px
   and failed the fit gate. The screen beneath must not reflow. */
#anchorPanel{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule-strong);
  box-shadow:0 10px 24px -8px rgba(0,0,0,.3);padding:.7em .9em .85em;
  max-height:78dvh;overflow-y:auto}
#anchorPanel.open{display:block}
#scrim{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.18)}
#scrim.open{display:block}
table.anchor{width:100%;border-collapse:collapse;font-size:.78em}
table.anchor th,table.anchor td{text-align:left;vertical-align:top;padding:.34em .4em;
  border-bottom:1px solid var(--rule)}
table.anchor th{color:var(--muted);font-weight:600}
table.anchor td:first-child{font-weight:700;white-space:nowrap}
.key{margin-top:.6em;padding:.5em .6em;border-left:3px solid var(--focus);font-size:.8em;
  line-height:1.45;background:color-mix(in srgb,var(--focus) 7%,transparent)}

/* ---- panels ---- */
main{flex:1 1 auto;min-height:0;position:relative}
.panel{display:none;height:100%;overflow:hidden}
.panel.active{display:flex;flex-direction:column}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100%}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:.7em .9em .2em}
.pager{flex:0 0 auto;display:flex;gap:.5em;padding:.4em .9em calc(.5em + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule)}
.pager button{flex:1;min-height:44px;border:1px solid var(--rule-strong);border-radius:6px;
  background:var(--surface);color:var(--text);font:inherit;font-size:.86em;font-weight:600;cursor:pointer}
.pager button:disabled{opacity:.33}
.body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto}

/* ---- spine ---- */
.glyph{flex:0 0 auto;display:flex;align-items:center;margin-bottom:.75em}
.glyph .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule-strong);
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  font-size:.62em;font-weight:700;color:var(--faint)}
.glyph .n.done{border-color:var(--faint);color:var(--muted)}
.glyph .n.here{border-color:var(--focus);background:var(--focus);color:var(--bg);transform:scale(1.14)}
.glyph .seg{flex:1 1 auto;height:1.5px;background:var(--rule-strong)}
.head{display:flex;align-items:center;gap:.5em;margin-bottom:.4em}
.head .step{font-size:.72em;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.chip{font-size:.68em;font-weight:700;letter-spacing:.06em;padding:.2em .45em;
  border-radius:3px;border:1px solid currentColor}
.claim{font-size:1.24em;font-weight:600;line-height:1.3;margin-bottom:.5em}
.claim em{font-style:normal;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.because{font-size:.95em;margin-bottom:.55em}
/* criterion 4: the connecting prose stays. Do not compress it into the glyph. */
.forces{font-size:.85em;color:var(--muted);padding-left:.7em;border-left:2px solid var(--rule-strong);
  margin-bottom:.6em}
.forces b{color:var(--text);font-weight:600}
.caveat{font-size:.8em;line-height:1.45;padding:.45em .55em;margin-bottom:.5em;
  border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.caveat.ours{border-left-color:var(--ours);background:color-mix(in srgb,var(--ours) 9%,transparent)}
.caveat .tag{font-weight:700;font-size:.9em}
/* ---- citations: {{id}} markers in the prose render as numerals that open the
   source card. Vertical padding gives a 44pt hit area without changing the
   line height (line-height:0 keeps the superscript from spreading the lines). */
a.cite{vertical-align:super;font-size:.66em;line-height:0;font-weight:700;border:0;
  padding:19px 6px;margin:0 -5px;color:var(--focus)}
.cite-sep{color:var(--faint);font-size:.66em;vertical-align:super;line-height:0}
.cite.bad{color:#b3261e;font-weight:700}
/* The evidence list sits below the text in a [data-fit-exempt] region, like the
   figures: it is reference, not reading, so it does not count toward the fit. */
.ev{margin-top:.6em;border-top:1px solid var(--rule);padding-top:.35em}
.ev b{display:block;font-size:.7em;color:var(--faint);text-transform:uppercase;
  letter-spacing:.05em;margin:.1em 0 .1em}
a.evrow{display:flex;align-items:center;gap:.5em;min-height:44px;border:0;color:var(--text);
  font-size:.8em;line-height:1.3;border-bottom:1px solid var(--rule)}
.evrow .evn,.card .sn{flex:0 0 auto;min-width:1.7em;text-align:center;font-weight:700;font-size:.85em;
  color:var(--focus);border:1px solid var(--rule-strong);border-radius:3px;padding:.05em .25em}
.evrow .evl{color:var(--faint)}

/* ---- clusters ---- */
.ctabs{flex:0 0 auto;display:flex;gap:.35em;margin-bottom:.7em}
.ctabs button{flex:1;min-height:44px;border:1px solid var(--rule-strong);border-radius:6px;
  background:var(--surface);color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.ctabs button[aria-selected="true"]{color:var(--bg);border-color:transparent}
.cbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:.6em}
.cbody h2{font-size:1.08em;margin-bottom:.3em}
.cbody .lead{font-size:.85em;color:var(--muted);margin-bottom:.7em;line-height:1.45}
.sub{border-top:1px solid var(--rule);padding:.55em 0}
.sub.first{border-top:0;padding-top:0}
.sub .code{font-weight:700;font-size:.8em;letter-spacing:.04em}
.sub .t{font-weight:600;font-size:.92em;margin-bottom:.15em}
.sub .d{font-size:.82em;color:var(--muted);line-height:1.45}

/* ---- source cards: flat, and EXEMPT from the fit gate (no data-fit) ---- */
.filterbar{flex:0 0 auto;display:flex;gap:.3em;padding:.6em .9em;border-bottom:1px solid var(--rule);
  background:var(--surface)}
.filterbar button{flex:1;min-height:44px;border:1px solid var(--rule-strong);border-radius:6px;
  background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.84em;cursor:pointer}
.filterbar button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.count{padding:.5em .9em .2em;font-size:.76em;color:var(--faint)}
.card{margin:.55em .9em;padding:.7em .75em;background:var(--surface);border:1px solid var(--rule);
  border-left-width:3px;border-radius:5px}
.card .nm{font-weight:700;font-size:1.02em;line-height:1.25}
.card .meta{font-size:.76em;color:var(--faint);margin-bottom:.4em}
.card .lv{font-size:.68em;font-weight:700;padding:.14em .38em;border-radius:3px;
  background:var(--rule);color:var(--muted);white-space:nowrap;margin-left:.4em}
.card .says{font-size:.84em;line-height:1.5;margin-bottom:.45em}
/* The signature field. Never put this behind a tap, and never truncate it to
   fit a screen — the nuance is the value. */
.card .not{font-size:.81em;line-height:1.45;padding:.4em .5em;border-radius:4px;
  border-left:2px solid var(--k4);background:color-mix(in srgb,var(--k4) 9%,transparent)}
.card .not .tag{font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:.86em;color:var(--k4)}
.card .ann{font-size:.79em;line-height:1.45;margin-top:.4em;color:var(--muted)}
.card .ann b{color:var(--warn)}
.card .ann.o b{color:var(--ours)}
.card .lk{display:inline-block;margin-top:.5em;font-size:.8em}
.card .sn{display:inline-block;margin-right:.45em;vertical-align:.1em}
.card{scroll-margin-top:.6em}
.card.hit{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
/* Return bar: shown only after a citation opened a card. The phone's back
   gesture does the same thing, because each jump is a history entry. */
#backbar{display:none;flex:0 0 auto;align-items:center;gap:.5em;width:100%;min-height:44px;
  padding:.3em .9em;border:0;border-bottom:1px solid var(--rule);background:var(--surface);
  color:var(--focus);font:inherit;font-size:.84em;font-weight:600;text-align:left;cursor:pointer}
#backbar.on{display:flex}
#backbar .loc{color:var(--muted);font-weight:400}

/* ---- open questions ---- */
.gapwrap{padding:.8em .9em calc(1em + env(safe-area-inset-bottom))}
.gapwrap h2{font-size:1.1em;margin:1.1em 0 .25em}
.gapwrap h2:first-of-type{margin-top:0}
.gapwrap .intro{font-size:.85em;color:var(--muted);line-height:1.5;margin-bottom:.9em}
.big{padding:.7em .75em;margin-bottom:.6em;background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--focus);border-radius:5px}
.big .q{font-weight:700;margin-bottom:.25em}
.big .w{font-size:.83em;color:var(--muted);line-height:1.5}
.item{border-top:1px solid var(--rule);padding:.55em 0;font-size:.84em;line-height:1.5}
.item .mk{font-weight:700;color:var(--warn)}
.item .mk.o{color:var(--ours)}

/* ---- figures: below the text, outside the fit gate ([data-fit-exempt]) ---- */
.figcue{font-size:.74em;color:var(--faint);margin-top:.45em}
.figs{padding:.1em 0 1em}
.fig{margin:.8em 0 0}
/* White frame in both themes: paper figures assume a white page, and dark
   mode would otherwise put black axis labels on a near-black ground. */
.figbtn{display:block;width:100%;padding:.4em;border:1px solid var(--rule);border-radius:6px;
  background:#fff;color:#191817;cursor:zoom-in;font:inherit}
.figbtn img{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain}
.fig.missing .figbtn{min-height:120px;color:#8a1c1c;font-weight:700;cursor:default}
.fig figcaption{font-size:.8em;line-height:1.45;margin-top:.4em}
.fig .ftag{font-weight:700;color:var(--warn)}
.fig .cr{display:block;font-size:.9em;color:var(--faint);margin-top:.15em}
.fig .cr a{display:inline-flex;align-items:center;min-height:44px}
/* Enlarge overlay: the figure is already on screen; this only adds pixels. */
#lightbox{display:none;position:fixed;inset:0;z-index:60;background:#fff;overflow:auto;
  -webkit-overflow-scrolling:touch}
#lightbox.open{display:block}
#lightbox img{display:block;max-width:none;margin:52px auto 1em}
#lbClose{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;min-width:44px;min-height:44px;
  border:1px solid #cdc8c0;border-radius:22px;background:#fff;color:#191817;font:inherit;
  font-size:1.1em;cursor:pointer;z-index:61}

/* ---- bottom nav ---- */
nav{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:52px;border:0;background:transparent;color:var(--faint);
  font:inherit;font-size:.8em;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  border-top:2px solid transparent;margin-top:-1px}
nav button[aria-selected="true"]{color:var(--text);border-top-color:var(--focus)}
</style>
</head>
<body>

<header>
  <div class="brand"><b id="brandT">REPLACE — artifact title</b></div>
  <!-- Omit this whole control if the corpus has no anchor vocabulary. Do not invent one. -->
  <button id="anchorBtn" aria-expanded="false" aria-controls="anchorPanel"></button>
  <div id="anchorPanel"></div>
</header>
<div id="scrim" aria-hidden="true"></div>

<main>
  <section class="panel active" id="p-spine" role="tabpanel">
    <div class="stage">
      <div class="glyph" id="glyph" aria-hidden="true"></div>
      <div class="head"><span class="step" id="step"></span><span class="chip" id="chip"></span></div>
      <div class="claim" id="claim"></div>
      <div class="body-scroll" data-fit="spine">
        <div class="because" id="because"></div>
        <div class="forces" id="forces"></div>
        <div id="cav"></div>
        <div id="sfigs"></div>
      </div>
    </div>
    <div class="pager"><button id="sprev">← Back</button><button id="snext">Next →</button></div>
  </section>

  <section class="panel" id="p-clusters" role="tabpanel">
    <div class="stage">
      <div class="ctabs" id="ctabs" role="tablist"></div>
      <div class="cbody" id="cbody" data-fit="cluster"></div>
    </div>
    <div class="pager"><button id="cprev">← Back</button><button id="cnext">Next →</button></div>
  </section>

  <section class="panel" id="p-sources" role="tabpanel">
    <button id="backbar" type="button"></button>
    <div class="filterbar" id="filterbar"></div>
    <div class="scroll"><div class="count" id="count"></div><div id="list"></div></div>
  </section>

  <section class="panel" id="p-open" role="tabpanel">
    <div class="scroll"><div class="gapwrap" id="gapwrap"></div></div>
  </section>
</main>

<nav role="tablist" id="nav"></nav>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged figure">
  <button id="lbClose" type="button" aria-label="Close">✕</button><img id="lbImg" alt="">
</div>

<script>
/* =========================================================================
   DATA — replace everything in this block. The code below is presentation.

   Every string here is prose the reader sees: write it to references/style.md.

   `not` is the signature field: what the source must NOT be cited for. Harvest
   these from errata, critique tables, limitations sections, and anywhere the
   corpus says "an earlier draft wrongly...". Expect them to be the artifact's
   most durable value.

   `lv` (grade/level) goes ONLY where the source speaks to a graded claim. A
   methods survey or a standards document usually speaks to none, and forcing a
   grade on it manufactures the category error the vocabulary exists to
   prevent. Expect many cards to carry none.

   CITATIONS. Every source card has an `id` (lowercase, digits, hyphens), chosen
   once and never derived from its position or name. A sentence that rests on a
   source carries a marker inside its own string: {{id}}, or {{id|locator}}
   with a section, page, table or figure (`§III`, `p. 646`, `Table 2`). Place it
   before the sentence's final full stop. Two sources: {{a}}{{b}}. The marker
   renders as a numeral that opens the card, and each screen's evidence list is
   derived from its markers, plus `ev:[ids]` for a source behind the screen as
   a whole. Never keep that list by hand.
   The marker is part of the sentence, so it moves with the claim through every
   revision. A deleted claim takes its marker with it, and a new claim needs
   one. A sentence that carries a number or a quotation and has no source gets
   {{nocite|reason}}, which renders as nothing and is listed by the audit.
   scripts/cite-audit.py (gate 11) checks all of this.
   ========================================================================= */
const DATA = {
  title: 'REPLACE — artifact title',
  tabs: {spine:'argument', clusters:'fields', sources:'sources', open:'open'},

  /* The small distinction the whole corpus hinges on. Set to null if none. */
  anchor: {
    levels: [
      {k:'A', gloss:'direct evidence'},
      {k:'B', gloss:'indirect / proxy'},
      {k:'C', gloss:'inference only'}
    ],
    table: {
      cols: ['Grade','Establishes','Certainty','Cost'],
      rows: [
        ['A','the outcome itself was measured','high','slow, expensive'],
        ['B','a reproducible stand-in was measured','reproducible, but a PROXY','moderate'],
        ['C','argued from theory; nothing measured','none','free']
      ]
    },
    key: 'How B differs from A, in plain sentences. A proxy can be reproducible and still ' +
         'tell you nothing about the outcome. Reproducibility belongs to the measurement and ' +
         'the outcome belongs to the world. State the distinction this corpus hinges on.'
  },

  /* Claims in dependency order. Count the real nodes; do not infer from headings. */
  spine: [
    {k:'1', claim:'The first claim, stated flatly in one sentence',
     because:'What this claim rests on, in full prose. A sentence that rests on a source ' +
             'carries its marker, as this one does{{trap-source|Table 2}}. Keep the connecting ' +
             'sentences, because the evidence supports diagrams alongside prose and never instead of it.',
     forces:'The next question or the next claim, in one plain sentence.',
     /* Sources behind the screen as a whole, beyond those its markers cite. */
     ev:['ungraded-source'],
     /* One per node; a second only for a different relation, with its own brief.
        brief: written BEFORE retrieval from references/visuals.md. rel = the one
        relation to see; kind = a kind from visuals.md §2-3; form = form, encodings,
        what it leaves out. from: 'evidence' (a figure from a source behind this
        link), 'drawn' (made for this artifact from the sources' own numbers) or
        'illustration' (a public figure from outside the cited evidence).
        cap names what to look at and how it bears on the claim. */
     figs:[{img:'example-fig', from:'evidence',
            brief:{rel:'The left pair of bars differs and the right pair does not.', kind:'comparison',
                   form:'Bars on one aligned axis, compared pairs adjacent; other conditions left out.'},
            alt:'What the figure depicts, for a reader who cannot see it.',
            cap:'Where to look and what it shows. The left pair of bars is the claim above.',
            credit:'Author et al. Year, Fig. 3b · CC BY 4.0', u:'https://example.org/'}]},
    {k:'2', claim:'The second claim',
     because:'Its support.',
     forces:'What it forces next.',
     cav:[{t:'ours', x:'An inference of the author’s that appears in no cited source. ' +
             'Render caveats WITH the claim, never behind a tap.'}],
     /* Only when nothing meets the brief after all three sources, or the brief's
        kind is 'value' (reason begins "value:"). The fit check reports it; the
        reason goes to the user. */
     figs:[], nofig:'The brief\'s relation, why nothing meets it, and what was searched.'}
  ],

  /* Paged by SUBSECTION, not by cluster: whole clusters overflow the fit gate. */
  clusters: {
    A: {t:'First literature', lead:'One or two lines on what this cluster covers.',
        subs:[{c:'A1', t:'A subsection', d:'What it establishes, at the level of structure. ' +
                 'A measured result, such as 9 of 108 builds, carries its source{{trap-source}}.',
               figs:[{img:'example-fig', from:'illustration',
                      brief:{rel:'Each stage feeds the next.', kind:'process',
                             form:'Static flow diagram, numbered nodes, labelled arrows, top to bottom.'},
                      alt:'Alt text.',
                      cap:'What this shows and which part of the subsection it supports.',
                      credit:'Wikimedia Commons, Name · CC BY-SA 4.0', u:'https://example.org/'}]},
              {c:'A2', t:'Another', d:'Keep each to roughly one screen.', figs:[], nofig:'Reason.'}]},
    B: {t:'Second literature', lead:'Its remit.',
        subs:[{c:'B1', t:'A subsection', d:'Its content.', figs:[], nofig:'Reason.'}]}
  },

  sources: [
    {id:'trap-source', n:'A source with a known mis-citation trap', m:'Venue Year · Authors', k:'A', lv:'B',
     s:'What it actually claims, stated so a reader can check a citation against it. ' +
       'Put the numbers and quotations the screens cite here too (9 of 108), so the audit can match them.',
     not:'What it must not be cited for. Name the trap: what it measured against what it ' +
         'gets cited for, an author order that is wrong everywhere, or an assumption nobody ' +
         'checks.',
     ann:{t:'inc', x:'Why this rests on an incomplete read, if it does.'},
     u:'https://example.org/'},
    {id:'ungraded-source', n:'A source with no graded claim', m:'Venue Year', k:'B',
     s:'A survey or standards document speaks to no graded claim, so it carries no grade.',
     u:'https://example.org/'}
  ],

  open: {
    intro:'What the corpus does not settle. Two annotations mark claims the sources ' +
          'themselves qualify. There is no "verified" marker, because certifying every claim ' +
          'needs evidence the corpus does not contain.',
    questions:[{q:'The highest-leverage open question?', w:'Why it decides something downstream.'}],
    incomplete:[{h:'A claim resting on an abstract', x:'What has not been read.'}],
    ours:[{h:'An unsourced inference', x:'Whose it is and why it is not in any cited work.'}]
  }
};

/* Filled by `scripts/figures.py inline <artifact> figures/`. Do not edit by hand. */
const FIGS=/*FIGS-BEGIN*/{}/*FIGS-END*/;

/* ===================== presentation ===================== */
const $=s=>document.querySelector(s), esc=h=>h,
  attr=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

/* citations: {{id}} or {{id|locator}} in any prose string becomes a numeral
   linking to card `id`. C() renders one string and records what it cited in
   `used`, so the evidence list is derived from the prose and never kept by hand. */
const SRC={}; DATA.sources.forEach((s,i)=>{if(s.id)SRC[s.id]={s:s,n:i+1}});
const MARK=/\{\{([^{}|]+)(?:\|([^{}]*))?\}\}/g, RUN=/(?:\{\{[^{}]+\}\})+/g;
function C(h,used){
  /* adjacent markers render as one group, "12,14". A CSS a+a rule cannot do
     this, because sibling selectors ignore the text between two numerals. */
  return String(h||'').replace(RUN,run=>{
    const out=[];
    run.replace(MARK,(m,id,loc)=>{
      id=id.trim(); loc=(loc||'').trim();
      if(id==='nocite')return '';
      const c=SRC[id]; if(used)used.push([id,loc]);
      out.push(c?'<a class="cite" href="#src-'+id+'" data-src="'+id+'" data-loc="'+attr(loc)+'" aria-label="Source '+
        c.n+(loc?', '+attr(loc):'')+'">'+c.n+'</a>':'<span class="cite bad">[?'+attr(id)+']</span>');
      return '';
    });
    return out.join('<span class="cite-sep">,</span>');
  });
}
function evHTML(used,ev){
  const order=[], locs={};
  used.concat((ev||[]).map(id=>[id,''])).forEach(([id,loc])=>{
    if(!SRC[id])return;
    if(!locs[id]){locs[id]=[];order.push(id)}
    if(loc&&locs[id].indexOf(loc)<0)locs[id].push(loc);
  });
  return order.length?'<div class="ev" data-fit-exempt><b>Evidence on this screen</b>'+order.map(id=>
    '<a class="evrow" href="#src-'+id+'" data-src="'+id+'"><span class="evn">'+SRC[id].n+'</span><span>'+
    SRC[id].s.n+(locs[id].length?' <span class="evl">· '+locs[id].join(', ')+'</span>':'')+'</span></a>').join('')+'</div>':'';
}

/* figures: a cue inside the text (it counts toward the fit), then the evidence
   list and the figures in the exempt region below it */
const FTAG={illustration:'Illustration from outside the cited evidence.',drawn:'Drawn for this artifact.'};
function figsHTML(list,nofig,ev){
  list=list||[];
  const cue=list.length?'<div class="figcue">↓ '+list.length+(list.length>1?' figures':' figure')+' below</div>':'';
  return cue+(ev||'')+'<div class="figs" data-fit-exempt'+(list.length?'':' data-nofig="'+attr(nofig||'')+'"')+'>'+
    list.map(f=>{const src=FIGS[f.img],b=f.brief||{};
      return '<figure class="fig'+(src?'':' missing')+'" data-from="'+attr(f.from)+
        '" data-rel="'+attr(b.rel||'')+'" data-kind="'+attr(b.kind||'')+'" data-form="'+attr(b.form||'')+'">'+
        '<button class="figbtn" type="button" aria-label="Enlarge figure">'+
        (src?'<img src="'+src+'" alt="'+attr(f.alt)+'">':'missing figure: '+attr(f.img))+'</button>'+
        '<figcaption>'+(FTAG[f.from]?'<span class="ftag">'+FTAG[f.from]+'</span> ':'')+C(f.cap)+
        '<span class="cr">'+(f.credit||'')+(f.u?' · <a href="'+attr(f.u)+
        '" target="_blank" rel="noopener">source ↗</a>':'')+'</span></figcaption></figure>';
    }).join('')+'</div>';
}
const lb=$('#lightbox'), lbSet=src=>{lb.classList.toggle('open',!!src); if(src)$('#lbImg').src=src;};
document.addEventListener('click',e=>{const b=e.target.closest('.figbtn'), i=b&&b.querySelector('img');
  if(i){lbSet(i.src);lb.scrollTop=0;}});
lb.addEventListener('click',e=>{if(e.target.id!=='lbImg')lbSet(null)});
addEventListener('keydown',e=>{if(e.key==='Escape')lbSet(null)});
const KEYS=Object.keys(DATA.clusters), HUE={}; KEYS.forEach((k,i)=>HUE[k]='--k'+((i%4)+1));
document.title=DATA.title; $('#brandT').textContent=DATA.title;

/* anchor vocabulary — omitted entirely when the corpus has none */
if(DATA.anchor){
  $('#anchorBtn').innerHTML=DATA.anchor.levels.map(l=>
    '<span class="lv"><span class="k">'+l.k+'</span><span class="g">'+l.gloss+'</span></span>').join('')
    +'<span class="caret">▾</span>';
  $('#anchorPanel').innerHTML='<table class="anchor"><thead><tr>'+
    DATA.anchor.table.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
    DATA.anchor.table.rows.map(r=>'<tr>'+r.map((c,i)=>'<td>'+c+'</td>').join('')+'</tr>').join('')+
    '</tbody></table><div class="key">'+C(DATA.anchor.key)+'</div>';
  const ab=$('#anchorBtn'), ap=$('#anchorPanel'), sc=$('#scrim');
  const set=o=>{ap.classList.toggle('open',o);sc.classList.toggle('open',o);
    ab.setAttribute('aria-expanded',o?'true':'false')};
  ab.addEventListener('click',()=>set(!ap.classList.contains('open')));
  sc.addEventListener('click',()=>set(false));
  addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
}else{ $('#anchorBtn').remove(); $('#anchorPanel').remove(); }

/* spine */
let si=0;
function drawSpine(){
  const n=DATA.spine[si], g=$('#glyph'); g.innerHTML='';
  DATA.spine.forEach((_,i)=>{
    if(i) g.insertAdjacentHTML('beforeend','<span class="seg"></span>');
    g.insertAdjacentHTML('beforeend','<span class="n '+(i===si?'here':i<si?'done':'')+'">'+(i+1)+'</span>');
  });
  $('#step').textContent='Link '+(si+1)+' of '+DATA.spine.length;
  $('#chip').textContent=n.k; $('#chip').style.color='var(--focus)';
  const used=[];
  $('#claim').innerHTML=C(n.claim,used); $('#because').innerHTML=C(n.because,used);
  $('#forces').innerHTML=C(n.forces,used);
  $('#cav').innerHTML=(n.cav||[]).map(c=>'<div class="caveat'+(c.t==='ours'?' ours':'')+'">'+
    '<span class="tag">'+(c.t==='ours'?'○ ours, unsourced':'◐ read with care')+'</span> — '+C(c.x,used)+'</div>').join('');
  $('#sfigs').innerHTML=figsHTML(n.figs,n.nofig,evHTML(used,n.ev));
  $('#sprev').disabled=si===0; $('#snext').disabled=si===DATA.spine.length-1;
  $('#p-spine .body-scroll').scrollTop=0;
}
$('#sprev').onclick=()=>{if(si>0){si--;drawSpine()}};
$('#snext').onclick=()=>{if(si<DATA.spine.length-1){si++;drawSpine()}};
drawSpine();

/* clusters — paged by subsection */
let ck=KEYS[0], cj=0;
$('#ctabs').innerHTML=KEYS.map(k=>'<button role="tab" data-k="'+k+'">'+k+'</button>').join('');
$('#ctabs').addEventListener('click',e=>{const b=e.target.closest('button');
  if(b){ck=b.dataset.k;cj=0;drawCluster()}});
function drawCluster(){
  $('#ctabs').querySelectorAll('button').forEach(b=>{
    const on=b.dataset.k===ck; b.setAttribute('aria-selected',on?'true':'false');
    b.style.background=on?'var('+HUE[b.dataset.k]+')':'';
  });
  const c=DATA.clusters[ck], s=c.subs[cj], used=[];
  $('#cbody').innerHTML=(cj===0?'<h2>'+ck+' · '+c.t+'</h2><p class="lead">'+C(c.lead,used)+'</p>':'')+
    '<div class="sub'+(cj===0?'':' first')+'"><div class="code" style="color:var('+HUE[ck]+')">'+s.c+
    '<span style="color:var(--faint);font-weight:400"> · '+(cj+1)+' of '+c.subs.length+'</span></div>'+
    '<div class="t">'+C(s.t,used)+'</div><div class="d">'+C(s.d,used)+'</div></div>'+
    figsHTML(s.figs,s.nofig,evHTML(used,s.ev));
  $('#cprev').disabled=cj===0; $('#cnext').disabled=cj===c.subs.length-1;
  $('#cbody').scrollTop=0;
}
$('#cprev').onclick=()=>{if(cj>0){cj--;drawCluster()}};
$('#cnext').onclick=()=>{if(cj<DATA.clusters[ck].subs.length-1){cj++;drawCluster()}};
drawCluster();

/* sources — flat cards, exempt from the fit gate */
let sf='all';
$('#filterbar').innerHTML=['all'].concat(KEYS).map(k=>
  '<button data-k="'+k+'">'+(k==='all'?'All':k)+'</button>').join('');
$('#filterbar').addEventListener('click',e=>{const b=e.target.closest('button');
  if(b){sf=b.dataset.k;drawSources()}});
function drawSources(){
  $('#filterbar').querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-pressed',b.dataset.k===sf?'true':'false'));
  const l=DATA.sources.filter(s=>sf==='all'||s.k===sf);
  $('#count').textContent=l.length+' of '+DATA.sources.length+
    ' · a grade appears only where the source speaks to one';
  $('#list').innerHTML=l.map(s=>'<div class="card"'+(s.id?' id="src-'+s.id+'"':'')+
    ' style="border-left-color:var('+HUE[s.k]+')">'+
    '<div>'+(s.id?'<span class="sn">'+SRC[s.id].n+'</span>':'')+'<span class="nm">'+s.n+'</span>'+
    (s.lv?'<span class="lv">'+s.lv+'</span>':'')+'</div>'+
    '<div class="meta">'+s.m+'</div><div class="says">'+C(s.s)+'</div>'+
    (s.not?'<div class="not"><span class="tag">do not cite for</span><br>'+C(s.not)+'</div>':'')+
    (s.ann?'<div class="ann'+(s.ann.t==='ours'?' o':'')+'"><b>'+
      (s.ann.t==='ours'?'○ ours':'◐ incomplete read')+'</b> — '+C(s.ann.x)+'</div>':'')+
    (s.u?'<a class="lk" href="'+s.u+'" target="_blank" rel="noopener">open source ↗</a>':'')+
    '</div>').join('');
}
drawSources();

/* open questions */
$('#gapwrap').innerHTML='<p class="intro">'+C(DATA.open.intro)+'</p><h2>The open questions</h2>'+
  DATA.open.questions.map(g=>'<div class="big"><div class="q">'+C(g.q)+'</div><div class="w">'+C(g.w)+'</div></div>').join('')+
  '<h2>◐ Resting on an incomplete read</h2>'+
  DATA.open.incomplete.map(i=>'<div class="item"><span class="mk">◐</span> <b>'+i.h+'</b> — '+C(i.x)+'</div>').join('')+
  '<h2>○ Ours, in no cited source</h2>'+
  DATA.open.ours.map(i=>'<div class="item"><span class="mk o">○</span> <b>'+i.h+'</b> — '+C(i.x)+'</div>').join('');

/* tabs */
const T=DATA.tabs, order=[['spine',T.spine],['clusters',T.clusters],['sources',T.sources],['open',T.open]];
$('#nav').innerHTML=order.map(([id,lab],i)=>
  '<button data-p="'+id+'" aria-selected="'+(i===0)+'">'+lab+'</button>').join('');
function showPanel(p){
  $('#nav').querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x.dataset.p===p?'true':'false'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+p));
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return;
  back=null; $('#backbar').classList.remove('on'); showPanel(b.dataset.p);
});

/* citation jumps. A tap on a numeral or an evidence row opens the card and
   pushes a history entry, so the back bar and the phone's back gesture both
   return the reader to the screen and scroll position they left. */
let back=null;
function here(){
  const p=(document.querySelector('.panel.active')||{id:'p-spine'}).id.slice(2);
  const sc=p==='spine'?$('#p-spine .body-scroll'):p==='clusters'?$('#cbody'):$('#p-'+p+' .scroll');
  const label=p==='spine'?T.spine+', link '+DATA.spine[si].k:
    p==='clusters'?T.clusters+', '+DATA.clusters[ck].subs[cj].c:T[p]||p;
  return {p:p,si:si,ck:ck,cj:cj,top:sc?sc.scrollTop:0,label:label,sc:sc};
}
function restore(b){
  if(!b)return;
  showPanel(b.p);
  if(b.p==='spine'){si=b.si;drawSpine()} else if(b.p==='clusters'){ck=b.ck;cj=b.cj;drawCluster()}
  const sc=here().sc; if(sc)sc.scrollTop=b.top;
  back=null; $('#backbar').classList.remove('on');
}
function openSource(id,loc){
  if(!SRC[id])return;
  sf='all'; drawSources(); showPanel('sources');
  const el=document.getElementById('src-'+id);
  el.classList.add('hit'); el.scrollIntoView({block:'start'});
  const bb=$('#backbar');
  if(back){bb.innerHTML='← Back to '+back.label+(loc?' <span class="loc">· cited at '+attr(loc)+'</span>':'');
    bb.classList.add('on');}
  else bb.classList.remove('on');
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-src]'); if(!a)return;
  e.preventDefault();
  if(!a.closest('#p-sources'))back=here();
  const id=a.dataset.src, loc=a.dataset.loc||'';
  try{history.pushState({src:id,loc:loc},'','#src-'+id)}catch(_){}
  openSource(id,loc);
});
$('#backbar').addEventListener('click',()=>{
  if(history.state&&history.state.src){try{history.back();return}catch(_){}}
  restore(back);
});
addEventListener('popstate',e=>{
  if(e.state&&e.state.src)openSource(e.state.src,e.state.loc); else restore(back);
});
if(/^#src-/.test(location.hash))openSource(location.hash.slice(5),'');

/* ---------------------------------------------------------------------------
   FIT-CHECK CONTRACT. scripts/fit-check.sh iterates this list, calling show()
   and then measuring every [data-fit] container up to its [data-fit-exempt]
   figure region, then counting that screen's figures (1-2 with briefs, or a nofig reason). Keep it in step with the
   reading surfaces, or the gate silently stops covering them. Source cards are
   deliberately absent: they are browsed, not read.
   --------------------------------------------------------------------------- */
window.__fitScreens = (function(){
  const list=[], show=p=>()=>{
    document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===p));
  };
  DATA.spine.forEach((_,i)=>list.push({name:'spine-'+(i+1),
    show:()=>{show('p-spine')(); si=i; drawSpine();}}));
  KEYS.forEach(k=>DATA.clusters[k].subs.forEach((_,j)=>list.push({name:'cluster-'+k+(j+1),
    show:()=>{show('p-clusters')(); ck=k; cj=j; drawCluster();}})));
  return list;
})();
</script>
</body>
</html>
